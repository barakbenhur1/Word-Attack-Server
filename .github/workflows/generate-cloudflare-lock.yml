name: Generate Cloudflare lockfile

on:
  push:
    paths:
      - ".github/workflows/generate-cloudflare-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate cloudflare/package-lock.json
        run: npm --prefix cloudflare install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare/package-lock.json && [ -f cloudflare/package-lock.json ]; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/package-lock.json
          git commit -m "Add Cloudflare package lock"
          git push origin HEAD:main
