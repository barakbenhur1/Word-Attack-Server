name: Cloudflare backend checks

on:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-ci.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm --prefix cloudflare run check
      - name: Static contract check
        run: npm --prefix cloudflare run verify:static
