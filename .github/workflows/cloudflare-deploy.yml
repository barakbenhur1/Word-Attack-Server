name: Deploy WordZap Cloudflare

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without deploying"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "cloudflare/DEPLOY_REQUEST"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Provision D1, apply schema and deploy Worker
        run: npm --prefix cloudflare run provision:deploy
